name: smart_ambulance_driver
description: Smart App for Ambulance Driver
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  flutter_map: ^6.1.0  # The engine to render your own map
  latlong2: ^0.9.0     # To handle GPS coordinates
  
  cupertino_icons: ^1.0.6
  google_maps_flutter: ^2.5.0
  geolocator: ^13.0.0
  provider: ^6.1.1
  http: ^1.6.0
  shared_preferences: ^2.2.2
  url_launcher: ^6.3.2
  supabase_flutter: ^2.12.0
  geolocator_android: ^4.6.2
  google_mlkit_text_recognition: ^0.15.1
  dynamsoft_mrz_scanner_bundle_flutter: ^3.2.5000
  image_picker: ^1.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  supabase_flutter: ^2.0.0
  camera: ^0.11.0
  image: ^4.1.3 # Used for cropping the image bytes

flutter:
  uses-material-design: true
